name: check

on:
  push:
  pull_request:

jobs:
  docs-and-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: zsh -n scripts/*.sh
      - name: Check JSON template
        run: python3 -m json.tool templates/lead.json >/dev/null
